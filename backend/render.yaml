services:
  - type: web
    name: humanizeai-backend
    env: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: MODEL_PROVIDER_TYPE
        value: lightning
      - key: MODEL_PROVIDER_URL
        sync: false
      - key: DEBUG
        value: "false"
